# Put this inside the TLS-enabled server{} block for mcp.example.com.
# Replace RANDOM_SECRET with `openssl rand -hex 32`.

location ^~ /RANDOM_SECRET/mcp {
    rewrite ^/RANDOM_SECRET(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 2m;
}

location = /mcp {
    return 404;
}
