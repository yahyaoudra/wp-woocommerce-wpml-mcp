services:
  wp-mcp:
    build: .
    container_name: wp-woocommerce-wpml-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8090),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
